name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract game project
        run: unzip block_survival_github_ready.zip

      - name: Build APK
        run: |
          mkdir -p block_survival/build
          godot --headless --path block_survival --export-debug "Android" block_survival/build/BlockSurvival.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockSurvival-APK
          path: block_survival/build/BlockSurvival.apk
